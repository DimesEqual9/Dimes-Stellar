- type: entity
  abstract: true
  parent: StellarClothingOuterBase
  id: StellarHardsuitBase
  categories: [ HideSpawnMenu ]
  components:
  # SlotBlocker blocked until UI change | AftrLite says: What?
  #  - type: SlotBlock
  #    slots: [innerclothing, feet]
#  - type: Geiger
#    attachedToSuit: true | Commented out for now, Geiger sounds are atrocious.
  - type: AllowSuitStorage
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
  - type: HeldSpeedModifier
  - type: Item
    size: Huge
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Radiation: 0.9
  - type: Clothing
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
  - type: ToggleableClothing
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: GroupExamine
  - type: Tag
    tags:
    - Hardsuit
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 # the average lightbulb only does around four damage!
    slots: OUTERCLOTHING
  - type: HideLayerClothing
    layers:
      Tail: OUTERCLOTHING

- type: entity
  abstract: true
  id: StellarHardsuitHelmetBase
  categories: [ HideSpawnMenu ]
  components:
  # SlotBlocker blocked until UI change
  #  - type: SlotBlock
  #    slots: [ears, eyes, mask]
  - type: BreathMask
  - type: Sprite
    state: icon-helmet
  - type: Clickable
  - type: InteractionOutline
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
    #Apparently the hardsuit helmet equip sound is from a walking mech? | AftrLite: Guess these need changing lmao TODO: LOREM IPSUM
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    quickEquip: false
    slots: [ HEAD ]
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: GroupExamine
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      FacialHair: HEAD
      HeadTop : HEAD
      HeadSide : HEAD
      Snout : HEAD

- type: entity
  abstract: true
  parent: StellarHardsuitHelmetBase
  id: StellarHardsuitHelmetBaseUnshaded
  name: hardsuit helmet
  categories: [ HideSpawnMenu ]
  components:
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
      - state: equipped-HELMET-unshaded
        shader: unshaded
