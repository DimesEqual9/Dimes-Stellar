- type: entity
  parent: StellarWeaponGorlexBase
  id: StellarWeaponGorlexCerberus
  name: Cerberus IV
  components:
  - type: Sprite
    sprite: _ST/Items/Weapons/Guns/echion-cerberus.rsi
  - type: Appearance
  - type: MagazineVisuals
  - type: Item
    sprite: _ST/Items/Weapons/Guns/echion-cerberus.rsi
  - type: Gun
    cameraRecoilScalar: 2.375
    minAngle: 0
    maxAngle: 24
    fireRate: 1.5
    angleIncrease: 8
    angleDecay: 60
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_ST/Weapons/Guns/echion-cerberus.ogg
      params:
        variation: 0.1
  - type: StellarCrosshair
    rsi:
      sprite: _ST/Interface/Crosshair/echion-cursor.rsi
      state: cerberus
  - type: StellarGunReloadable
    shootable: StellarHitscanEchionCerberus
    muzzleFlash: StellarMuzzleFlashEchionHeavy
    ammoMaxReserves: 13
    ammoMagCapacity: 13

