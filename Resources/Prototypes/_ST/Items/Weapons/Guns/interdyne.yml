- type: entity
  parent: StellarWeaponInterdyneBase
  id: StellarWeaponInterdyneNeedle
  name: Disp-needle DT
  components:
  - type: Sprite
    sprite: _ST/Items/Weapons/Guns/interdyne-needle.rsi
  - type: Appearance
  - type: MagazineVisuals
  - type: Item
    sprite: _ST/Items/Weapons/Guns/interdyne-needle.rsi
  - type: Gun
    cameraRecoilScalar: 0.675
    minAngle: 3
    maxAngle: 15
    fireRate: 6.5
    angleIncrease: 3
    angleDecay: 10
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_ST/Weapons/Guns/interdyne-needle.ogg
      params:
        variation: 0.1
        volume: -2
  - type: StellarCrosshair
    rsi:
      sprite: _ST/Interface/Crosshair/interdyne-cursor.rsi
      state: disp-needle
  - type: StellarGunReloadable
    showWeaponType: false
    weaponType: StellarGunTypeDisposablePistol
    shootable: StellarHitscanInterdyneBase
    muzzleFlash: StellarMuzzleFlashInterdyne
    ammoMaxReserves: 0
    ammoMagCapacity: 24

