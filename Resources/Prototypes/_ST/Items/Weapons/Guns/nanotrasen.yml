- type: soundCollection
  id: StellarSoundCollectionWeaponAegis
  files:
  - /Audio/_ST/Weapons/Guns/nanotrasen-aegis.ogg
  - /Audio/_ST/Weapons/Guns/nanotrasen-aegis-alt.ogg

- type: entity
  parent: StellarWeaponNanoTrasenBase
  id: StellarWeaponNanoTrasenAegis
  name: Aegis NT9
  components:
  - type: Sprite
    sprite: _ST/Items/Weapons/Guns/nanotrasen-aegis.rsi
  - type: Appearance
  - type: MagazineVisuals
  - type: Item
    sprite: _ST/Items/Weapons/Guns/nanotrasen-aegis.rsi
    size: Small
    shape:
    - 0,0,1,1
  - type: Gun
    burstCooldown: 0.7667
    cameraRecoilScalar: 0.75
    minAngle: 1.5
    maxAngle: 12
    fireRate: 5
    burstFireRate: 15
    angleIncrease: 2
    angleDecay: 12
    selectedMode: Burst
    availableModes:
    - Burst
    - FullAuto
    soundGunshot:
      collection: StellarSoundCollectionWeaponAegis
      params:
        variation: 0.1
        volume: -2
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 1
    offsetSpeed: 1
    pvsIncrease: 0.1
  - type: Wieldable
  - type: GunRequiresWield
  - type: StellarCrosshair
    rsi:
      sprite: _ST/Interface/Crosshair/nanotrasen-cursor.rsi
      state: aegis
  - type: StellarAmmoRegen
    regenInterval: 7.5
  - type: StellarGunReloadable
    weaponType: StellarGunTypeEnergyRifle
    shootable: StellarHitscanNanotrasenAegis
    muzzleFlash: StellarMuzzleFlashNanotrasen
    reloadTime: 2.5
    ammoMaxReserves: 44
    ammoMagCapacity: 24
    rampingFireRate: 4
    rampingBulletsNeeded: 6
    soundReload:
      path: /Audio/_ST/Weapons/Guns/Reload/nanotrasen-reload-aegis.ogg
      params:
        variation: 0.05

