- type: entity
  name: entropic blade
  parent: BaseItem
  id: StellarWeaponCosmicBlade
  description: An eerie greatsword wrought of indescribable material, forcibly extruded down into reality.
  categories: [ ForkFiltered ]
  components:
  - type: CosmicEquipment
  - type: Sprite
    sprite: _ST/Items/Weapons/Melee/Cosmic/cosmic-sword.rsi
    layers:
    - state: icon
    - state: icon-overlay
      shader: unshaded
  - type: MeleeWeapon
    resistanceBypass: true
    angle: 90
    animation: WeaponArcCosmic
    wideAnimationRotation: -135
    attackRate: 0.62
    clickDamageModifier: 1.1
    damage:
      types:
        Slash: 11
        Asphyxiation: 12
        Cold: 12
        Structural: 15
    soundHit:
      path: /Audio/_ST/CosmicCult/cosmicsword_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_ST/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/_ST/CosmicCult/cosmicsword-glance.ogg
      params:
        variation: 0.2
        volume: -11
  - type: Reflect
    reflectProb: .21
    spread: 120
    soundOnReflect:
      path: /Audio/_ST/CosmicCult/cosmicsword-glance.ogg
      params:
        variation: 0.2
        volume: -6
  - type: Wieldable
    wieldSound:
      path: /Audio/_ST/CosmicCult/cosmic_wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/_ST/CosmicCult/cosmic_unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 3
        Structural: 5
  - type: DisarmMalus
  - type: Item
    size: Huge
    sprite: _ST/Items/Weapons/Melee/Cosmic/cosmic-sword-inhands.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right

- type: entity
  name: vacuous lance
  parent: BaseItem
  id: StellarWeaponCosmicLance
  description: An unnerving spear, wrought of indescribable material. Being near it feels like a prickle of static spreading through your nerves.
  categories: [ ForkFiltered ]
  components:
  - type: CosmicEquipment
  - type: EmbeddableProjectile
    removalTime: 2
    sound: /Audio/_ST/CosmicCult/cosmiclance_impact.ogg
  - type: Sprite
    sprite: _ST/Items/Weapons/Melee/Cosmic/cosmic-lance.rsi
    layers:
    - state: icon
    - state: icon-overlay
      shader: unshaded
  - type: MeleeWeapon
    resistanceBypass: true
    angle: 0
    animation: WeaponArcCosmic
    wideAnimation: WeaponArcThrust # ES - Animations with Easing
    wideAnimationRotation: -135
    attackRate: 0.62
    damage:
      types:
        Piercing: 12
        Asphyxiation: 10
        Cold: 10
    soundHit:
      path: /Audio/_ST/CosmicCult/cosmiclance_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_ST/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4
    soundNoDamage:
      path: /Audio/_ST/CosmicCult/cosmicsword-glance.ogg
      params:
        variation: 0.2
        volume: -11
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 16
        Cold: 20
  - type: Wieldable
    wieldSound:
      path: /Audio/_ST/CosmicCult/cosmic_wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/_ST/CosmicCult/cosmic_unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 5
  - type: Item
    size: Huge
    sprite: _ST/Items/Weapons/Melee/Cosmic/cosmic-lance-inhands.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: EmitSoundOnThrow
    sound: /Audio/_ST/CosmicCult/cosmicweapon_swing.ogg
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp


- type: entity
  name: astral razor
  parent: BaseItem
  id: StellarWeaponCosmicScythe
  categories: [ ForkFiltered ]
  components:
  - type: CosmicEquipment
  - type: Sprite
    sprite: _ST/Items/Weapons/Melee/Cosmic/cosmic-scythe.rsi
    layers:
    - state: icon
    - state: icon-overlay
      shader: unshaded
  # - type: AmmoCounter
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 2
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -4
        Slash: -4
        Piercing: -4
  - type: Gun
    projectileSpeed: 15
    soundGunshot: /Audio/_ST/CosmicCult/projectile_razor.ogg
    soundEmpty: null
    fireRate: 1
    useKey: false
  - type: StellarGunReloadable
    weaponType: StellarGunTypeMisc
    shootable: StellarHitscanMalignRazor
    showExamineText: false
    showWeaponType: false
    ammoMaxReserves: 1
    ammoMagCapacity: 1
    reloadTime: 0.1
  - type: StellarAmmoRegen
    regenInterval: 1.8
    soundOnRegen:
      path: /Audio/_ST/CosmicCult/projectile_razor_reload.ogg
      params:
        variation: 0.08
  - type: MeleeWeapon
    resistanceBypass: true
    wideAnimationRotation: -135
    animation: WeaponArcCosmic
    attackRate: 0.62
    clickDamageModifier: 1.1
    damage:
      types:
        Slash: 4
        Piercing: 4
        Asphyxiation: 8
        Cold: 8
        Structural: 15
    soundHit:
      path: /Audio/_ST/CosmicCult/cosmicsword_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_ST/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.124
        volume: -4
    soundNoDamage:
      path: /Audio/_ST/CosmicCult/cosmicsword-glance.ogg
      params:
        variation: 0.2
        volume: -11
  - type: Wieldable
    wieldSound:
      path: /Audio/_ST/CosmicCult/cosmic_wield.ogg
      params:
        variation: 0.2
        volume: -2
    unwieldSound:
      path: /Audio/_ST/CosmicCult/cosmic_unwield.ogg
      params:
        variation: 0.2
        volume: 0
  - type: IncreaseDamageOnWield
    damage:
      types:
        Structural: 5
  - type: GunRequiresWield
  - type: Item
    size: Ginormous
    sprite: _ST/Items/Weapons/Melee/Cosmic/cosmic-scythe-inhands.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
