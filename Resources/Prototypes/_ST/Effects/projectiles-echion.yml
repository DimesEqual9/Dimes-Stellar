- type: entity
  abstract: true
  parent: StellarHitscanVisualsBase
  id: StellarHitscanEchionBase
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: HitscanReflect
  - type: StellarGunHitscan
    collisionMask: BulletImpassable
    lightColor: "#83db2b"
    hitColor: "#83db2b"
    unshaded: true
    ray:
      sprite: _ST/Projectiles/Guns/echion-medium.rsi

