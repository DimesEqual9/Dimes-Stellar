- type: entity
  abstract: true
  parent: StellarMuzzleFlashBase
  id: StellarMuzzleFlashEchionBase
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#83db2b"
    radius: 10
    energy: 0.9
    mask: /Textures/_ST/LightMasks/cone-rotated.png
    enabled: true
    autoRot: true
    castShadows: false
    netsync: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: StellarMuzzleFlashEchionBase
  id: StellarMuzzleFlashEchionLight
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Projectiles/Guns/echion-light.rsi
  - type: PointLight
    radius: 8
    energy: 0.6

- type: entity
