- type: entity
  abstract: true
  parent: StellarMuzzleFlashBase
  id: StellarMuzzleFlashCybersunBase
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#9a5cf1"
    radius: 10
    energy: 0.9
    mask: /Textures/_ST/LightMasks/cone-rotated.png
    enabled: true
    autoRot: true
    castShadows: false
    netsync: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: StellarMuzzleFlashCybersunBase
  id: StellarMuzzleFlashCybersunLight
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Projectiles/Guns/tachyon-light.rsi
  - type: PointLight
    radius: 8
    energy: 0.6

- type: entity
  parent: StellarMuzzleFlashCybersunBase
  id: StellarMuzzleFlashCybersunHeavy
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Projectiles/Guns/tachyon-heavy.rsi
    offset: 0.25, 0
  - type: PointLight
    radius: 20
    energy: 2

- type: entity
  abstract: true
  parent: StellarHitscanVisualsBase
  id: StellarHitscanCybersunBase
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
  - type: HitscanReflect
  - type: StellarGunHitscan
    lightColor: "#fcbf41"
    unshaded: true
    ray:
      sprite: _ST/Projectiles/Guns/tachyon-light.rsi

- type: entity
  parent: StellarHitscanCybersunBase
  id: StellarHitscanCybersunTsugaru
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 10
  - type: StellarGunHitscan
    maxDistance: 10
    minDistance: 6
    falloffModifier: 0.60
    damage:
      types:
        Heat: 10
        Caustic: 10
    ray:
      sprite: _ST/Projectiles/Guns/tachyon-light.rsi

- type: entity
  parent: StellarHitscanCybersunBase
  id: StellarHitscanCybersunSadamune
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicRaycast
    maxDistance: 20
  - type: StellarGunHitscan
    maxDistance: 20
    minDistance: 15
    falloffModifier: 0.80
    damage:
      types:
        Heat: 62.5
        Caustic: 62.5
    ray:
      sprite: _ST/Projectiles/Guns/tachyon-heavy.rsi
