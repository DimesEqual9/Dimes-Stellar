- type: entity
  id: StellarBulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#FFFFFF"
    radius: 1.5
    energy: 1
    mask: /Textures/_ST/LightMasks/compact-line.png
    enabled: true
    autoRot: true
    castShadows: false
    netsync: false
  - type: TimedDespawn
    lifetime: 1.5
  - type: Sprite
    loop: false
    drawdepth: BelowMobs
    layers:
    - map: ["enum.StellarHitscanLayers.Unshaded"]
      shader: unshaded
    - map: ["enum.StellarHitscanLayers.Shaded"]
      shader: shaded
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

- type: entity
  abstract: true
  id: StellarHitscanVisualsBase
  categories: [ HideSpawnMenu ]
  components:
  - type: EffectVisuals
  - type: HitscanBasicRaycast
  - type: StellarGunHitscan
    lightColor: "#FFFFFF"
    unshaded: false
    ray:
      sprite: _ST/Projectiles/Guns/kinetic-light.rsi
      state: bullet

- type: entity
  abstract: true
  id: StellarMuzzleFlashBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.4
  - type: Sprite
    sprite: _ST/Projectiles/Guns/kinetic-light.rsi
    loop: false
    drawdepth: Mobs
    layers:
    - map: ["enum.StellarHitscanLayers.Unshaded"]
      offset: 0.5, 0
      shader: unshaded
      state: muzzle
  - type: PointLight
    color: "#FFFFFF"
    radius: 5
    energy: 3.4
    mask: /Textures/_ST/LightMasks/cone-rotated.png
    enabled: true
    autoRot: true
    castShadows: false
    netsync: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: StellarHitscanBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2.0
  - type: Sprite
    loop: false
    drawdepth: BelowMobs
    layers:
    - map: ["enum.StellarHitscanLayers.Unshaded"]
      shader: unshaded
    - map: ["enum.StellarHitscanLayers.Shaded"]
      shader: shaded
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer
