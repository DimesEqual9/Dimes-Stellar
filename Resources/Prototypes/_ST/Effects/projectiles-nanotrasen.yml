- type: entity
  parent: StellarMuzzleFlashBase
  id: StellarMuzzleFlashNanotrasen
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ST/Projectiles/Guns/nanotrasen-light.rsi
  - type: PointLight
    color: "#f35851"
    radius: 3
    energy: 3.4
    mask: /Textures/_ST/LightMasks/cone-rotated.png
    enabled: true
    autoRot: true
    castShadows: false
    netsync: false
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  abstract: true
  parent: StellarHitscanVisualsBase
  id: StellarHitscanNanotrasenBase
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanReflect
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: StellarGunHitscan
    collisionMask: BulletImpassable
    lightColor: "#f35851"
    unshaded: false
    ray:
      sprite: _ST/Projectiles/Guns/nanotrasen-light.rsi

- type: entity
  parent: StellarHitscanNanotrasenBase
