- type: entity
  parent: WeatherBase
  id: StellarWeatherDetailFog
  components:
  - type: WeatherStatusEffect
    scrolling: -0.04, 0.05
    color: "#7987a7"
    override: true
    sprite:
      sprite: /Textures/_ST/Effects/weather.rsi
      state: fog
    sound:
      collection: Rain
      params:
        loop: true
        volume: -6

- type: entity
  parent: WeatherBase
  id: StellarWeatherStationShield
  components:
  - type: WeatherStatusEffect
    scrolling: 0.25, 0.25
    override: true
    opacity: 0.2
    sprite:
      sprite: /Textures/_ST/Effects/weather.rsi
      state: shield

- type: entity
  parent: WeatherBase
  id: StellarWeatherStationHyperShield
  components:
  - type: WeatherStatusEffect
    scrolling: 0.25, 0.25
    override: true
    opacity: 0.2
    sprite:
      sprite: /Textures/_ST/Effects/weather.rsi
      state: shield-hyper
