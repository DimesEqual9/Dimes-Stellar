### ASTRAL PROJECTION
- type: entity
  abstract: true
  parent: BaseSimpleMob
  id: BaseCosmicMob
  components:
  - type: Puller
    needsHands: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 6
    weightlessModifier: 1.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Physics
    bodyStatus: InAir
  - type: NoSlip
  - type: CanMoveInAir
  - type: Eye
    drawFov: true
  - type: ContentEye
  - type: Speech
    speechVerb: Ghost
  - type: TypingIndicator
    proto: CosmicTyping
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 2
    softness: 1
    castShadows: false
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 0.5
       endValue: 2
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true

- type: entity
  parent: BaseCosmicMob
  id: MobCosmicCustodian
  name: malign custodian
  description: An abomination wrought of malign mass. It floats with a weightless, unnerving grace.
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
    weightlessModifier: 1
  - type: Sprite
    sprite: _ST/CosmicCult/Mobs/custodian.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: custodian
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: custodian_unshaded
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: custodian
        BaseUnshaded: custodian_unshaded
      Dead:
        Base: dead
        BaseUnshaded: dead_unshaded

