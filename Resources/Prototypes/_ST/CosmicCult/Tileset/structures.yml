  components:
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: _ST/CosmicCult/Tileset/decor-48x.rsi
    state: base-1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "0.30,0.40,-0.30,-0.1"
        density: 190
        mask:
        - LargeMobMask
        layer:
        - WallLayer

- type: entity
  parent: CosmicDecor1
  id: CosmicDecor2
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: base-2
