##################### MONUMENT
- type: entity
  id: CosmicMonument
  parent: BaseStructure
  name: The Monument
  description: Built of a thousand little nothings, its surface reflects a starless emptiness...
  categories: [ ForkFiltered ]
  components:
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: CosmicMonument
  - type: CosmicExamine
    cultistText: cosmic-examine-text-monument
    othersText: cosmic-examine-text-crew-monument
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.25,-0.01,1.25,0.7"
        density: 9999
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _ST/CosmicCult/Tileset/monument.rsi
    offset: 0, 1.155
    drawdepth: Mobs
    layers:
    - state: base
    - state: vfx-2
      sprite: _ST/CosmicCult/Effects/monument-vfx.rsi
      offset: -0.03, 0.5
      shader: unshaded
      visible: false
      map: ["effects"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MonumentVisuals.Status:
        effects:
          Idle: { visible: false }
          Finale: { visible: true }
  - type: AmbientSound
    enabled: true
    volume: -8
    range: 9
    sound:
      path: /Audio/_ST/CosmicCult/monument-ambient.ogg
  - type: PointLight
    radius: 6
    energy: 4
    falloff: 2
    enabled: true
    castShadows: true
    color: "#42a4ae"
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 4
      maxDuration: 8
      startValue: 2
      endValue: 4
      property: Energy
      enabled: true
      isLooped: true
      reverseWhenFinished: true
  - type: GuideHelp
    guides:
    - CosmicCult
  - type: WarpPoint
    location: The Monument

##################### PLINTH
- type: entity
  parent: BaseStructure
  id: CosmicPlinth
  name: malign plinth
  description: An eerie structure.
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: true
  - type: PlaceableSurface
  - type: Climbable
  - type: Sprite
    noRot: true
    sprite: _ST/CosmicCult/Tileset/plinth.rsi
    layers:
    - state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "0.30,0.40,-0.30,-0.1"
        density: 190
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: PointLight
    color: "#42a4ae"
    radius: 2.5
    energy: 6
    enabled: false
    castShadows: false
    netsync: false

##################### PILLAR
- type: entity
  parent: BaseStructure
  id: CosmicObelisk
  name: malign obelisk
  description: A mysterious-yet-inert sturcture. Unsettling.
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _ST/CosmicCult/Tileset/cosmicpillar.rsi
    offset: 0, 0.5
    layers:
      - state: icon
    drawdepth: Mobs
    noRot: true
  - type: CosmicExamine
    cultistText: cosmic-examine-text-forthecult
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.1,0.2,0.375"
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

##################### LAMP
- type: entity
  id: CosmicLamp
  description: A mote of un-light shimmers within.
  suffix: Always Powered
  name: malign light
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: Transform
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _ST/CosmicCult/Tileset/cosmiclight.rsi
    drawdepth: Mobs
    layers:
      - state: base
      - state: glow
        shader: unshaded
  - type: PointLight
    color: "#42a4ae" # 5000K color temp
    energy: 2
    radius: 8
    softness: 1
    offset: "0, -0.5"

##################### DECOR
- type: entity
  parent: BaseStructure
  id: CosmicDecor1
  categories: [ ForkFiltered ]
  placement:
