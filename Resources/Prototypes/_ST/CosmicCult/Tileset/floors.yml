#### "FLOOR DECAY" ENTITIES
- type: entity
  id: CosmicFloorDecay
  suffix: DO NOT MAP
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  categories: [ ForkFiltered ]
  components:
  - type: CosmicCollider # Cultists can walk through this.
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "0.45,0.45,-0.45,-0.45"
        density: 999
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    sprite: /Textures/_ST/CosmicCult/Tileset/cosmicfloor-decay.rsi
  - type: Icon
    sprite: /Textures/_ST/CosmicCult/Tileset/cosmicfloor-decay.rsi
    state: full
  - type: IconSmooth
    key: floor
    base: floor
  - type: Tag
    tags:
    - HideContextMenu
  - type: PlacementReplacement
    key: decay

- type: entity
  parent: CosmicFloorDecay
  id: CosmicFloorEntropicDecay
  suffix: DO NOT MAP
  categories: [ ForkFiltered ]
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: Sprite
    sprite: /Textures/_ST/CosmicCult/Tileset/cosmicfloor-decay.rsi
    drawdepth: BelowFloor
    layers:
    - state: decay
      shader: unshaded
  - type: PlacementReplacement
    key: decay
  - type: TileEmission
    color: "#605191FF"
