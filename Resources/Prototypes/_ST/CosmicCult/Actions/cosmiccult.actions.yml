- type: entity
  id: ActionCosmicSiphon
  name: Siphon Entropy
  description: Silently siphon entropy from your target, dealing some damage in the process.
  components:
  - type: Action
    useDelay: 50
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: siphon
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidProfile
    blacklist:
      components:
      - CosmicCult
      - ActiveNPC
    event: !type:EventCosmicSiphon {}

- type: entity
  id: ActionCosmicShunt
  name: Shunt Subjectivity
  description: Shunt your target's mind out of their body and unto the cosmic dark, temporarily rendering their body mindless.
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: shunt
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidProfile
    blacklist:
      components:
      - CosmicCult
      - CosmicBlank
      - ActiveNPC
    event: !type:EventCosmicShunt {}

- type: entity
  id: ActionCosmicLapse
  name: Abberant Lapse
  description: Lapse your target's corporeal form, temporarily rendering it immutable, impassible, and frozen in place.
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: lapse
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: true
    whitelist:
      components:
      - HumanoidProfile
    blacklist:
      components:
      - CosmicBlank
    event: !type:EventCosmicLapse {}

- type: entity
  id: ActionCosmicGlare
  name: Null Glare
  description: Emit a horrific pulse of cosmic light, slowing and disorienting everyone around you. Its effects are amplified against silicon-based entities.
  components:
  - type: ConfirmableAction
    popup: cosmicability-glare-confirm
    confirmDelay: 0.1
    primeTime: 3
  - type: Action
    useDelay: 60
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: glare
  - type: InstantAction
    event: !type:EventCosmicGlare {}

- type: entity
  id: ActionCosmicIngress
  name: Force Ingress
  description: Use a concentrated blast of power to force a secure doorway open.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: ingress
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
        - Door
    event: !type:EventCosmicIngress {}

- type: entity
  id: ActionCosmicImposition
  name: Vacuous Imposition
  description: You negate any incoming damage for a short time.
  components:
  - type: Action
    useDelay: 120
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: entropic
  - type: InstantAction
    event: !type:EventCosmicImposition {}

- type: entity
  id: ActionCosmicNova
  name: Astral Nova
  description: Hurl a large and disruptive blast of astral energy.
  components:
  - type: Action
    useDelay: 30
    raiseOnUser: true
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: nova
  - type: TargetAction
    range: 60
  - type: WorldTargetAction
    event: !type:EventCosmicNova {}

- type: entity
  id: ActionCosmicFragmentation
  name: Null Fragmentation
  description: Transfer your malign empowerment into a digital system, such as an AI Upload Console or Cyborg, corrupting it in the process. Doing so will expend your empowerment.
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: Action
    useDelay: 25
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: corruption
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - BorgChassis
      - SiliconLawUpdater
    blacklist:
      components:
      - CosmicCult
      - ActiveNPC
    event: !type:EventCosmicFragmentation {}

- type: entity
  id: ActionCosmicShift
  name: Astral Shift
  description: Slip out of phase with realspace in order to temporarily access the cosmic dark. You'll automatically return to the station after a period of time.
  components:
  - type: ConfirmableAction
    popup: cosmicability-shift-confirm
    confirmDelay: 0.075
    primeTime: 2
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    useDelay: 45
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: shift
  - type: InstantAction
    event: !type:EventCosmicShift {}

- type: entity
  id: ActionCosmicReturn
  name: Return
  description: Exit the dark and return to the station early.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: NoItem
    useDelay: 0
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: return
  - type: InstantAction
    event: !type:EventCosmicReturn {}







## COLOSSUS ACTIONS

- type: entity
  id: ActionCosmicColossusSunder
  name: Entropic Sunder
  description: Warp to the target location and unleash a cascading detonation of malign energy.
  components:
  - type: Action
    useDelay: 18
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: sunder
  - type: TargetAction
    range: 7
  - type: WorldTargetAction
    event: !type:EventCosmicColossusSunder

- type: entity
  id: ActionCosmicColossusIngress
  name: Colossal Ingress
  description: Use your colossal strength to force open a doorway.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: ingress
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    event: !type:EventCosmicColossusIngress
    whitelist:
      components:
        - Door

- type: entity
  id: ActionCosmicColossusHibernate
  name: Slumber Shell
  description: Slumber your body for a period of time to regenerate integrity. Must be done on stable ground.
  components:
  - type: LimitedCharges
    maxCharges: 2
  - type: Action
    useDelay: 120
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: _ST/CosmicCult/Icons/cosmiccult-abilities.rsi
      state: slumber
  - type: InstantAction
    event: !type:EventCosmicColossusHibernate {}
