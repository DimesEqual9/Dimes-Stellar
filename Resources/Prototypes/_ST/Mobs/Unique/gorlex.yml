- type: entity
  parent: [ BaseMob, FlyingMobBase ]
  id: StellarMobGorlexDrone
  name: Triage Drone
  description: No substitute for a doctor, but better than nothing.
  categories: [ ForkFiltered ]
  components:
  - type: Damageable
    damageContainer: Inorganic
  - type: MovedByPressure
  - type: Physics
    bodyType: KinematicController
  - type: StatusEffects
    allowed:
    - Electrocution
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: Sprite
    offset: 0, 0.5
    sprite: _ST/Mobs/Gorlex/triage-drone.rsi
    layers:
    - state: shadow-playable
      offset: 0, -0.25
      sprite: _ST/Effects/dropshadow.rsi
    - state: base
    - state: base-unshaded
      shader: unshaded
  - type: HTN
    rootTask:
      task: MedibotCompound
  - type: DoAfter
  - type: ZombieImmune
  - type: ProtectedFromStepTriggers
  - type: Pullable
  - type: PointLight
    enabled: true
    color: "#83db2b"
    radius: 2
    energy: 1
    castShadows: false
    autoRot: true
    netsync: false


- type: entity
  parent: StellarMobGorlexSlime
  id: StellarMobGorlexOperative # Reinforcement exclusive to nukeops uplink
  name: Gorlex Operative NPC
  categories: [ ForkFiltered ]
  components:
  - type: NukeOperative
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-operator
#  - type: Loadout
#    prototypes: [SyndicateOperativeGearFullNoUplink]
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: RandomHumanoidAppearance

